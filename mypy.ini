[mypy]
# sw/ uses implicit namespace packages (PEP 420). Without these flags, mypy
# resolves modules under both their full path (sw.replay.itch_parser) and
# their unprefixed form (replay.itch_parser), and complains about the
# duplicate. With them, mypy treats sw/ as the package base and module
# paths resolve unambiguously.
namespace_packages = True
explicit_package_bases = True
